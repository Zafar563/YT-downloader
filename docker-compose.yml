services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Backend port is exposed to the Docker network but not mapped directly to the host
    expose:
      - "8080"
    volumes:
      - ./downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GIN_MODE=release
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
