name: Manual Rollback

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Barcha tarix va teglarni yuklab olish (local xatolikni oldini oladi)

      - name: Delete latest release and rollback tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "Error: No releases found in this repository!"
            exit 1
          fi
          
          echo "Processing rollback: Deleting release and tag '$LATEST_RELEASE'..."
          
          # GitHub'dan release'ni o'chirish
          gh release delete "$LATEST_RELEASE" --yes
           
          git tag -d "$LATEST_RELEASE" || true
          
          git push origin --delete "$LATEST_RELEASE" || true
          
          echo "Rollback completed successfully."